name: Bootstrap portfolio repository

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait until payload is complete
        id: ready
        shell: bash
        run: |
          if [ -f .bootstrap/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize repository
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          mkdir -p /tmp/catoons-materialized
          tar -xzf /tmp/payload.tar.gz -C /tmp/catoons-materialized
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/catoons-materialized/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish Catoons TD beta portfolio"
          git push
