name: Materialize Catoons TD

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap2/READY3'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish game files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap2/payload.part* > /tmp/catoons.b64
          base64 --decode /tmp/catoons.b64 > /tmp/catoons.tar.gz
          echo "34c5d214bce50f1f23d47af834c6055715846879db695d46a6f5b9dd139e182a  /tmp/catoons.tar.gz" | sha256sum -c -
          mkdir -p /tmp/catoons
          tar -xzf /tmp/catoons.tar.gz -C /tmp/catoons --exclude='.github/workflows/ci.yml'
          cp -a /tmp/catoons/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md CHANGELOG.md CONTRIBUTING.md LICENSE PORTFOLIO_CHECKLIST.md .gitignore index.html src docs desktop scripts screenshots .github/ISSUE_TEMPLATE
          git commit -m "feat: publish Catoons TD beta portfolio"
          git push
