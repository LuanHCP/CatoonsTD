name: Validate beta

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check src/game.js

      - name: Check event, profile and recovery rules
        run: |
          node --check src/events.js
          node --check src/fieldwork.js
          node --check src/cloud-save.js
          node --check src/firebase-web.js
          node --check src/identity.js
          node --check src/multiplayer.js
          node tools/test-eclipse.mjs
          node tools/test-event-progression.mjs
          node tools/test-lan-recovery.mjs
          node tools/test-cloud-save.mjs

      - name: Validate release structure and HTML5 assets
        run: node scripts/validate-release.mjs

  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Cross-compile Windows launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o CatoonsTD.exe ./desktop/launcher.go
