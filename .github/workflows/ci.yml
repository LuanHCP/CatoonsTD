name: Validate beta

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check src/game.js

      - name: Verify web entrypoint
        run: test -f index.html && test -f src/style.css

  build-launcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Cross-compile Windows launcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o CatoonsTD.exe ./desktop/launcher.go
